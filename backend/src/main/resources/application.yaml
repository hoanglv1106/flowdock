spring:
  application:
    name: flowdock-backend
  datasource:
    url: ${FLOWDOCK_DB_URL}
    username: ${FLOWDOCK_DB_USER}
    password: ${FLOWDOCK_DB_PASSWORD}
  flyway:
    clean-disabled: true
  kafka:
    bootstrap-servers: ${FLOWDOCK_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
server:
  address: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${FLOWDOCK_DB_URL:jdbc:postgresql://127.0.0.1:15432/flowdock}
    username: ${FLOWDOCK_DB_USER:flowdock_lab}
    password: ${FLOWDOCK_DB_PASSWORD:flowdock_lab_only}
server:
  port: ${FLOWDOCK_BACKEND_PORT:18080}
